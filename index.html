<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#131314" />
  <title>J.A.R.V.I.S.</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <style>
    :root {
      --bg-main: #131314;
      --bg-surface: #1e1f20;
      --bg-elevated: #282a2c;
      --border-subtle: #333537;
      --text-primary: #e3e3e3;
      --text-secondary: #9aa0a6;
      --accent-blue: #8ab4f8;
      --accent-strong: #4285f4;
      --danger: #f28b82;
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      font-family: "Google Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    .hidden { display: none !important; }

    @keyframes screenFadeIn {
      from { opacity: 0; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================= LOGIN SCREEN ================= */
    #login-screen {
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
      background: radial-gradient(circle at top, #1b2234 0%, var(--bg-main) 65%);
      animation: screenFadeIn 0.32s var(--ease-spring) forwards;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 26px;
      padding: 36px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      text-align: center;
      animation: slideUpFade 0.4s var(--ease-spring) forwards;
    }

    .brand-orb {
      width: 54px;
      height: 54px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(66, 133, 244, 0.22), rgba(168, 199, 250, 0.1));
      border: 1px solid rgba(138, 180, 248, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-blue);
    }

    .login-card h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .login-card p {
      color: var(--text-secondary);
      font-size: 0.92rem;
      margin-bottom: 24px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .login-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-main);
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .login-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(138, 180, 248, 0.14);
    }

    .login-btn {
      width: 100%;
      min-height: 48px;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #4285f4, #669df6);
      color: #0b1220;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.16s var(--ease-spring);
    }

    .login-btn:hover { opacity: 0.92; }
    .login-btn:active { transform: scale(0.97); }
    .login-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .login-error {
      color: var(--danger);
      font-size: 0.86rem;
      min-height: 18px;
      margin-top: 2px;
    }

    /* ================= MAIN CHAT APP ================= */
    #app-screen {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      animation: screenFadeIn 0.32s var(--ease-spring) forwards;
    }

    header {
      min-height: calc(58px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 18px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(19, 19, 20, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title {
      font-size: 1.08rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .model-pill {
      font-size: 0.72rem;
      color: var(--accent-blue);
      background: rgba(138, 180, 248, 0.12);
      border: 1px solid rgba(138, 180, 248, 0.25);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      min-height: 36px;
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.14s var(--ease-spring);
    }

    .icon-btn:hover {
      background: var(--bg-surface);
      color: var(--text-primary);
    }

    .icon-btn:active { transform: scale(0.95); }

    .icon-btn.logout:hover {
      border-color: rgba(242, 139, 130, 0.5);
      color: var(--danger);
    }

    /* ================= CHAT STREAM ================= */
    #chat-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 16px 16px;
      scroll-behavior: smooth;
    }

    #chat-scroll::-webkit-scrollbar { width: 5px; }
    #chat-scroll::-webkit-scrollbar-thumb {
      background: #2f3134;
      border-radius: 999px;
    }

    .chat-container {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Welcome / Empty State */
    #welcome-view {
      margin: auto;
      padding: 32px 4px 20px;
      text-align: left;
      width: 100%;
    }

    .welcome-heading {
      font-size: clamp(1.75rem, 6vw, 2.5rem);
      font-weight: 500;
      line-height: 1.2;
      background: linear-gradient(90deg, #8ab4f8 0%, #c58af9 55%, #f28b82 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      animation: slideUpFade 0.4s var(--ease-spring) both;
    }

    .welcome-sub {
      font-size: clamp(1.2rem, 4.5vw, 1.65rem);
      color: #5f6368;
      font-weight: 500;
      margin-bottom: 24px;
      animation: slideUpFade 0.45s var(--ease-spring) 0.06s both;
    }

    .suggestion-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      animation: slideUpFade 0.5s var(--ease-spring) 0.12s both;
    }

    .chip {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 11px 16px;
      border-radius: 16px;
      font-size: 0.88rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.15s var(--ease-spring);
    }

    .chip:hover {
      background: var(--bg-elevated);
      border-color: #4b4e52;
    }

    .chip:active { transform: scale(0.96); }

    /* Message Rows */
    .msg-row {
      display: flex;
      width: 100%;
      animation: slideUpFade 0.28s var(--ease-spring) forwards;
    }

    .msg-row.user {
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .user-attachment-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 7px 12px;
      font-size: 0.82rem;
      color: var(--accent-blue);
      max-width: 84%;
    }

    .user-attachment-tag img {
      max-width: 180px;
      max-height: 140px;
      border-radius: 10px;
      display: block;
    }

    .user-bubble {
      background: var(--bg-elevated);
      color: var(--text-primary);
      padding: 12px 17px;
      border-radius: 22px 22px 6px 22px;
      max-width: 80%;
      line-height: 1.55;
      font-size: 0.97rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-row.ai {
      align-items: flex-start;
      gap: 12px;
    }

    .ai-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(138, 180, 248, 0.12);
      border: 1px solid rgba(138, 180, 248, 0.3);
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .ai-avatar.pulse {
      animation: pulseGlow 1.3s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    .ai-content {
      flex: 1;
      min-width: 0;
      line-height: 1.65;
      font-size: 0.98rem;
      color: var(--text-primary);
      word-break: break-word;
    }

    .ai-content h3 {
      margin: 14px 0 6px;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent-blue);
    }

    .ai-content h3:first-child { margin-top: 0; }

    .ai-content code {
      background: var(--bg-elevated);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
      font-size: 0.88em;
      color: #a8c7fa;
    }

    /* Styled Code Block with Header & Copy Button */
    .code-wrapper {
      background: #0d0e10;
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      margin: 12px 0;
      overflow: hidden;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 13px;
      background: #181a1f;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.76rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .copy-code-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 0.74rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .copy-code-btn:hover {
      background: var(--bg-elevated);
      border-color: var(--accent-blue);
    }

    .code-wrapper pre {
      padding: 13px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0;
    }

    .code-wrapper pre code {
      background: none;
      padding: 0;
      color: #e3e3e3;
      font-size: 0.86em;
      line-height: 1.5;
    }

    /* Generated Image / Vector Card */
    .media-card {
      margin-top: 12px;
      background: #0d0e10;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 10px;
      max-width: 520px;
    }

    .media-card img, .media-card svg {
      width: 100%;
      height: auto;
      border-radius: 10px;
      display: block;
    }

    .media-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .download-media-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--accent-blue);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      text-decoration: none;
      cursor: pointer;
    }

    /* Animated 3-dot Thinking Indicator */
    .thinking-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 30px;
      padding: 0 4px;
    }

    .thinking-wrap span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-blue);
      opacity: 0.4;
      animation: dotWave 1.2s infinite ease-in-out;
    }

    .thinking-wrap span:nth-child(2) { animation-delay: 0.16s; }
    .thinking-wrap span:nth-child(3) { animation-delay: 0.32s; }

    @keyframes dotWave {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    /* ================= BOTTOM INPUT DOCK ================= */
    .input-dock {
      padding: 8px 14px calc(12px + env(safe-area-inset-bottom));
      background: var(--bg-main);
      flex-shrink: 0;
    }

    .input-shell {
      max-width: 820px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 26px;
      padding: 6px 8px;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .input-shell:focus-within {
      background: #232426;
      border-color: #4c5057;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.28);
    }

    /* Attachment Preview Bar */
    #attachment-preview {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 8px 12px;
      margin: 2px 2px 6px;
      font-size: 0.84rem;
    }

    .preview-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .preview-thumb {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .preview-name {
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .remove-attach-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.15rem;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
    }

    .remove-attach-btn:hover { color: var(--danger); }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }

    #attach-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }

    #attach-btn:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    #prompt-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 16px;
      line-height: 1.45;
      max-height: 140px;
      padding: 8px 4px;
      resize: none;
      outline: none;
    }

    #prompt-input::placeholder { color: var(--text-secondary); }

    #send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--accent-blue);
      color: #0b1220;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s ease, transform 0.15s var(--ease-spring), background 0.2s ease;
    }

    #send-btn:hover { opacity: 0.92; }
    #send-btn:active { transform: scale(0.92); }
    #send-btn:disabled {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      cursor: not-allowed;
    }

    .footer-hint {
      text-align: center;
      color: #6b7075;
      font-size: 0.72rem;
      margin-top: 7px;
    }

    /* ================= MOBILE BREAKPOINT ================= */
    @media (max-width: 600px) {
      header { padding-left: 14px; padding-right: 14px; }
      .header-title { font-size: 1rem; }
      .icon-btn { padding: 6px 11px; font-size: 0.78rem; }
      #chat-scroll { padding: 16px 12px 12px; }
      .user-bubble { max-width: 86%; padding: 11px 15px; font-size: 0.95rem; }
      .msg-row.ai { gap: 10px; }
      .ai-avatar { width: 28px; height: 28px; }
      .ai-content { font-size: 0.95rem; }
      .suggestion-row { flex-direction: column; }
      .chip { width: 100%; }
      .login-card { padding: 28px 20px; border-radius: 22px; }
      .footer-hint { display: none; }
    }
  </style>
</head>
<body>

  <!-- LOGIN VIEW -->
  <section id="login-screen">
    <div class="login-card">
      <div class="brand-orb">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
        </svg>
      </div>
      <h1>J.A.R.V.I.S.</h1>
      <p>Enter your access passcode to initialize session</p>
      <form id="login-form" class="login-form">
        <input
          id="passcode-input"
          class="login-input"
          type="password"
          placeholder="Passcode"
          autocomplete="current-password"
          required
        />
        <button id="login-btn" class="login-btn" type="submit">Unlock System</button>
        <div id="login-error" class="login-error"></div>
      </form>
    </div>
  </section>

  <!-- CHAT VIEW -->
  <section id="app-screen" class="hidden">
    <header>
      <div class="header-left">
        <span class="header-title">J.A.R.V.I.S.</span>
        <span class="model-pill">Hydrogen</span>
      </div>
      <div class="header-actions">
        <button id="new-chat-btn" class="icon-btn" type="button">New chat</button>
        <button id="logout-btn" class="icon-btn logout" type="button">Logout</button>
      </div>
    </header>

    <main id="chat-scroll">
      <div id="chat-container" class="chat-container">
        <div id="welcome-view">
          <div class="welcome-heading">At your service, sir.</div>
          <div class="welcome-sub">Analyze PPTs, diagrams, audio, video, or write code.</div>
          <div class="suggestion-row">
            <button class="chip" type="button" data-prompt="Draw a clean diagram of client-server network architecture">Draw network diagram</button>
            <button class="chip" type="button" data-prompt="Write a clean C# console program for binary search with comments">Generate clean C# code</button>
            <button class="chip" type="button" data-prompt="What is the weather for today?">Quezon City weather</button>
          </div>
        </div>
      </div>
    </main>

    <div class="input-dock">
      <form id="chat-form" class="input-shell">
        <div id="attachment-preview" class="hidden">
          <div class="preview-info">
            <img id="preview-thumb" class="preview-thumb hidden" alt="Preview" />
            <span id="preview-name" class="preview-name"></span>
          </div>
          <button id="remove-attach-btn" class="remove-attach-btn" type="button" aria-label="Remove attachment">&times;</button>
        </div>

        <div class="input-row">
          <input
            id="file-input"
            type="file"
            class="hidden"
            accept="image/*,audio/*,video/*,.pdf,.pptx,.docx,.txt,.csv,.cs,.java,.py,.sql,.js,.html,.json"
          />
          <button id="attach-btn" type="button" title="Attach PPTX, image, audio, video, PDF, or code" aria-label="Attach file">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>

          <textarea
            id="prompt-input"
            rows="1"
            placeholder="Ask J.A.R.V.I.S. or attach PPTX, audio, video, image..."
          ></textarea>

          <button id="send-btn" type="submit" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </form>
      <div class="footer-hint">Supports large PPTX (including image-only slides &amp; diagrams), audio, video, PDF &amp; code.</div>
    </div>
  </section>

  <script>
    const WORKER_URL = "https://jarvis-brain.hydroflouride4.workers.dev";
    const STORAGE_KEY = "jarvis_session_passcode";

    const loginScreen = document.getElementById("login-screen");
    const appScreen = document.getElementById("app-screen");
    const loginForm = document.getElementById("login-form");
    const passcodeInput = document.getElementById("passcode-input");
    const loginBtn = document.getElementById("login-btn");
    const loginError = document.getElementById("login-error");

    const chatScroll = document.getElementById("chat-scroll");
    const chatContainer = document.getElementById("chat-container");
    const welcomeView = document.getElementById("welcome-view");
    const chatForm = document.getElementById("chat-form");
    const promptInput = document.getElementById("prompt-input");
    const sendBtn = document.getElementById("send-btn");

    const fileInput = document.getElementById("file-input");
    const attachBtn = document.getElementById("attach-btn");
    const attachmentPreview = document.getElementById("attachment-preview");
    const previewThumb = document.getElementById("preview-thumb");
    const previewName = document.getElementById("preview-name");
    const removeAttachBtn = document.getElementById("remove-attach-btn");

    let activePasscode = localStorage.getItem(STORAGE_KEY) || "";
    let history = [];
    let isSending = false;
    let isProcessingFile = false;
    let pendingAttachment = null;

    const SPARK_ICON = `
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
      </svg>
    `;

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatScroll.scrollTop = chatScroll.scrollHeight;
      });
    }

    function clearAttachment() {
      pendingAttachment = null;
      isProcessingFile = false;
      sendBtn.disabled = false;
      fileInput.value = "";
      previewThumb.src = "";
      previewThumb.classList.add("hidden");
      attachmentPreview.classList.add("hidden");
    }

    function showApp() {
      loginScreen.classList.add("hidden");
      appScreen.classList.remove("hidden");
      if (window.innerWidth > 600) promptInput.focus();
    }

    function showLogin(errorMsg = "") {
      appScreen.classList.add("hidden");
      loginScreen.classList.remove("hidden");
      loginError.textContent = errorMsg;
      passcodeInput.value = "";
      if (window.innerWidth > 600) passcodeInput.focus();
    }

    function resetChatUI() {
      history = [];
      clearAttachment();
      chatContainer.innerHTML = "";
      chatContainer.appendChild(welcomeView);
      welcomeView.classList.remove("hidden");
    }

    function logoutUser(reason = "") {
      activePasscode = "";
      localStorage.removeItem(STORAGE_KEY);
      resetChatUI();
      showLogin(reason);
    }

    window.addEventListener("storage", (e) => {
      if (e.key === STORAGE_KEY) {
        if (!e.newValue) {
          activePasscode = "";
          resetChatUI();
          showLogin("Logged out from another tab.");
        } else {
          activePasscode = e.newValue;
          showApp();
        }
      }
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => {
        if (!appScreen.classList.contains("hidden")) scrollToBottom();
      });
    }

    if (activePasscode) {
      showApp();
    } else {
      showLogin();
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const candidate = passcodeInput.value.trim();
      if (!candidate) return;

      loginBtn.disabled = true;
      loginBtn.textContent = "Verifying...";
      loginError.textContent = "";

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: "jarvis", passcode: candidate, history: [] }),
        });

        if (res.status === 401) {
          loginError.textContent = "Invalid passcode, sir. Access denied.";
        } else if (res.ok) {
          activePasscode = candidate;
          localStorage.setItem(STORAGE_KEY, candidate);
          resetChatUI();
          showApp();
        } else {
          loginError.textContent = `System error (${res.status}). Try again.`;
        }
      } catch (err) {
        loginError.textContent = "Cannot reach J.A.R.V.I.S. core. Check connection.";
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Unlock System";
      }
    });

    document.getElementById("new-chat-btn").addEventListener("click", resetChatUI);
    document.getElementById("logout-btn").addEventListener("click", () => logoutUser());

    // ================= MEDIA & DEEP PPTX PROCESSING =================
    attachBtn.addEventListener("click", () => {
      if (!isProcessingFile) fileInput.click();
    });
    removeAttachBtn.addEventListener("click", clearAttachment);

    function inferMimeType(file) {
      if (file.type) return file.type;
      const ext = file.name.split(".").pop().toLowerCase();
      const map = {
        mp3: "audio/mpeg",
        m4a: "audio/mp4",
        wav: "audio/wav",
        ogg: "audio/ogg",
        aac: "audio/aac",
        flac: "audio/flac",
        mp4: "video/mp4",
        webm: "video/webm",
        mov: "video/quicktime",
        mkv: "video/x-matroska",
        pdf: "application/pdf",
        png: "image/png",
        jpg: "image/jpeg",
        jpeg: "image/jpeg",
        webp: "image/webp",
      };
      return map[ext] || "application/octet-stream";
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = reader.result || "";
          const base64 = result.split(",")[1];
          resolve({ base64, dataUrl: result });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Compresses image blobs via Canvas so slides & mobile camera photos upload fast while keeping text sharp
    function compressImageBlob(blob, maxDim = 1280, quality = 0.82) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          // Skip tiny decorative icons/bullets (< 75x75 px)
          if (img.width < 75 || img.height < 75) {
            resolve(null);
            return;
          }
          let width = img.width;
          let height = img.height;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          // Fill white background in case PNG has transparency over dark text
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL("image/jpeg", quality);
          resolve({
            base64: dataUrl.split(",")[1],
            dataUrl,
            mimeType: "image/jpeg",
          });
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          resolve(null);
        };
        img.src = url;
      });
    }

    // Extracts BOTH native XML text/notes AND embedded slide images/diagrams from large PPTX files
    async function extractPptxDeep(file, onProgress) {
      if (!window.JSZip) throw new Error("PPTX parser still loading. Please try again in a second.");
      const zip = await JSZip.loadAsync(file);

      const slideFiles = Object.keys(zip.files)
        .filter((name) => /^ppt\/slides\/slide\d+\.xml$/i.test(name))
        .sort((a, b) => {
          const numA = parseInt(a.match(/slide(\d+)\.xml/i)[1], 10);
          const numB = parseInt(b.match(/slide(\d+)\.xml/i)[1], 10);
          return numA - numB;
        });

      const slidesData = [];
      const mediaUsageCount = {};

      // Pass 1: Extract XML text, speaker notes, and slide-to-image relationships
      for (let i = 0; i < slideFiles.length; i++) {
        const path = slideFiles[i];
        const slideNum = path.match(/slide(\d+)\.xml/i)[1];
        if (onProgress) onProgress(`Scanning Slide ${slideNum} of ${slideFiles.length}...`);

        const xmlStr = await zip.files[path].async("string");
        const doc = new DOMParser().parseFromString(xmlStr, "application/xml");
        const textNodes = Array.from(doc.getElementsByTagName("a:t"));
        const slideText = textNodes.map((n) => n.textContent).join(" ").replace(/\s+/g, " ").trim();

        // Check speaker notes if present
        let notesText = "";
        const notesFile = zip.files[`ppt/notesSlides/notesSlide${slideNum}.xml`];
        if (notesFile) {
          const notesXml = await notesFile.async("string");
          const notesDoc = new DOMParser().parseFromString(notesXml, "application/xml");
          notesText = Array.from(notesDoc.getElementsByTagName("a:t"))
            .map((n) => n.textContent)
            .join(" ")
            .replace(/\s+/g, " ")
            .trim();
        }

        // Map embedded images on this slide via .rels
        const relsFile = zip.files[`ppt/slides/_rels/slide${slideNum}.xml.rels`];
        const imagePaths = [];
        if (relsFile) {
          const relsXml = await relsFile.async("string");
          const relsDoc = new DOMParser().parseFromString(relsXml, "application/xml");
          const rels = Array.from(relsDoc.getElementsByTagName("Relationship"));
          for (const rel of rels) {
            const type = rel.getAttribute("Type") || "";
            const target = rel.getAttribute("Target") || "";
            if (type.endsWith("/image") && target) {
              const normalized = target.replace(/^\.\.\//, "ppt/");
              if (zip.files[normalized] && /\.(png|jpe?g|gif|webp|bmp)$/i.test(normalized)) {
                imagePaths.push(normalized);
                mediaUsageCount[normalized] = (mediaUsageCount[normalized] || 0) + 1;
              }
            }
          }
        }

        slidesData.push({
          slideNum: parseInt(slideNum, 10),
          text: slideText,
          notes: notesText,
          imagePaths: [...new Set(imagePaths)],
        });
      }

      // Pass 2: Prioritize image-only / low-text slides & diagram slides, skipping repeated template logos
      const prioritizedSlides = [...slidesData].sort((a, b) => {
        const aIsVisualOnly = a.text.length < 40 && a.imagePaths.length > 0 ? 0 : 1;
        const bIsVisualOnly = b.text.length < 40 && b.imagePaths.length > 0 ? 0 : 1;
        if (aIsVisualOnly !== bIsVisualOnly) return aIsVisualOnly - bIsVisualOnly;
        return a.slideNum - b.slideNum;
      });

      const extractedImages = [];
      const seenMedia = new Set();
      const MAX_SLIDE_IMAGES = 28;

      for (const slide of prioritizedSlides) {
        if (extractedImages.length >= MAX_SLIDE_IMAGES) break;
        for (const imgPath of slide.imagePaths) {
          if (extractedImages.length >= MAX_SLIDE_IMAGES) break;
          // Skip background watermarks/logos repeated on more than 4 slides
          if (mediaUsageCount[imgPath] > 4) continue;
          if (seenMedia.has(imgPath)) continue;
          seenMedia.add(imgPath);

          if (onProgress) {
            onProgress(`Reading visuals from Slide ${slide.slideNum} (${extractedImages.length + 1})...`);
          }
          const blob = await zip.files[imgPath].async("blob");
          if (blob.size < 3500) continue; // Skip tiny <3.5KB icons
          const compressed = await compressImageBlob(blob, 1280, 0.82);
          if (compressed) {
            extractedImages.push({
              slideNum: slide.slideNum,
              slideLabel: `Slide ${slide.slideNum}`,
              mimeType: compressed.mimeType,
              data: compressed.base64,
            });
          }
        }
      }

      // Sort extracted visuals back into chronological slide order
      extractedImages.sort((a, b) => a.slideNum - b.slideNum);

      const textSummary = slidesData
        .map((s) => {
          const parts = [`[Slide ${s.slideNum}]`];
          if (s.text) parts.push(s.text);
          else if (s.imagePaths.length > 0) parts.push("(Visual/Image-only slide — see attached slide image)");
          if (s.notes) parts.push(`Speaker Notes: ${s.notes}`);
          return parts.join("\n");
        })
        .join("\n\n");

      return {
        slideCount: slidesData.length,
        slidesText: textSummary,
        slideImages: extractedImages,
      };
    }

    async function extractDocxText(file) {
      if (!window.JSZip) throw new Error("DOCX parser still loading. Try again in a second.");
      const zip = await JSZip.loadAsync(file);
      const docXml = zip.files["word/document.xml"];
      if (!docXml) return "No readable text found in document.";
      const xmlStr = await docXml.async("string");
      const doc = new DOMParser().parseFromString(xmlStr, "application/xml");
      const paras = Array.from(doc.getElementsByTagName("w:p")).map((p) =>
        Array.from(p.getElementsByTagName("w:t"))
          .map((t) => t.textContent)
          .join("")
      );
      return paras.filter(Boolean).join("\n");
    }

    async function uploadLargeMediaToGemini(file, mimeType) {
      const res = await fetch(`${WORKER_URL}/upload`, {
        method: "POST",
        headers: {
          "X-Passcode": activePasscode,
          "X-Mime-Type": mimeType,
          "X-File-Name": encodeURIComponent(file.name),
        },
        body: file,
      });
      const data = await res.json();
      if (!res.ok || !data.fileUri) {
        throw new Error(data.error || `Upload failed (${res.status})`);
      }
      return data;
    }

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const maxBytes = 95 * 1024 * 1024; // 95 MB ceiling (supports large PPTX, audio & video)
      if (file.size > maxBytes) {
        alert("Please select a file under 95 MB.");
        fileInput.value = "";
        return;
      }

      isProcessingFile = true;
      sendBtn.disabled = true;

      const lowerName = file.name.toLowerCase();
      const mimeType = inferMimeType(file);
      previewName.textContent = `Processing ${file.name}...`;
      previewThumb.classList.add("hidden");
      attachmentPreview.classList.remove("hidden");

      try {
        if (lowerName.endsWith(".pptx")) {
          const pptxResult = await extractPptxDeep(file, (statusMsg) => {
            previewName.textContent = statusMsg;
          });
          pendingAttachment = {
            type: "pptx",
            name: file.name,
            slideCount: pptxResult.slideCount,
            slidesText: pptxResult.slidesText,
            slideImages: pptxResult.slideImages,
            badgeText: `PPTX: ${file.name} (${pptxResult.slideCount} slides, ${pptxResult.slideImages.length} visuals)`,
          };
          previewName.textContent = pendingAttachment.badgeText;
        } else if (lowerName.endsWith(".docx")) {
          const textContent = await extractDocxText(file);
          pendingAttachment = {
            type: "text",
            name: file.name,
            content: textContent,
            badgeText: `Word Doc: ${file.name}`,
          };
          previewName.textContent = pendingAttachment.badgeText;
        } else if (mimeType.startsWith("image/")) {
          // Compress large camera photos cleanly for fast mobile upload
          const compressed = await compressImageBlob(file, 1600, 0.88);
          if (compressed) {
            pendingAttachment = {
              type: "inline",
              mimeType: compressed.mimeType,
              data: compressed.base64,
              name: file.name,
              previewUrl: compressed.dataUrl,
              badgeText: `Image: ${file.name}`,
            };
          } else {
            const { base64, dataUrl } = await fileToBase64(file);
            pendingAttachment = {
              type: "inline",
              mimeType,
              data: base64,
              name: file.name,
              previewUrl: dataUrl,
              badgeText: `Image: ${file.name}`,
            };
          }
          previewName.textContent = file.name;
          previewThumb.src = pendingAttachment.previewUrl;
          previewThumb.classList.remove("hidden");
        } else if (
          mimeType.startsWith("audio/") ||
          mimeType.startsWith("video/") ||
          mimeType === "application/pdf"
        ) {
          const inlineLimit = 10 * 1024 * 1024; // 10 MB inline threshold; larger streams to Gemini File API
          const kindLabel = mimeType.startsWith("audio/")
            ? "Audio"
            : mimeType.startsWith("video/")
            ? "Video"
            : "PDF";

          if (file.size <= inlineLimit) {
            const { base64 } = await fileToBase64(file);
            pendingAttachment = {
              type: "inline",
              mimeType,
              data: base64,
              name: file.name,
              badgeText: `${kindLabel}: ${file.name}`,
            };
          } else {
            previewName.textContent = `Uploading large ${kindLabel.toLowerCase()} (${(file.size / (1024 * 1024)).toFixed(1)} MB)...`;
            const uploaded = await uploadLargeMediaToGemini(file, mimeType);
            pendingAttachment = {
              type: "file_uri",
              mimeType: uploaded.mimeType,
              fileUri: uploaded.fileUri,
              name: file.name,
              badgeText: `${kindLabel}: ${file.name}`,
            };
          }
          previewName.textContent = pendingAttachment.badgeText;
        } else {
          // Code files (.cs, .java, .py, .sql, .js, .html, .txt, .csv)
          const textContent = await file.text();
          pendingAttachment = {
            type: "text",
            name: file.name,
            content: textContent,
            badgeText: `File: ${file.name}`,
          };
          previewName.textContent = pendingAttachment.badgeText;
        }
      } catch (err) {
        alert(err.message || "Could not process that file.");
        clearAttachment();
      } finally {
        isProcessingFile = false;
        sendBtn.disabled = false;
      }
    });

    // ================= FORMATTING & CODE COPY =================
    function formatReply(text) {
      let safe = (text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      const codeBlocks = [];
      safe = safe.replace(/```([a-zA-Z0-9_+-]*)\s*\n([\s\S]*?)```/g, (_, lang, code) => {
        const idx = codeBlocks.length;
        const label = lang ? lang : "code";
        codeBlocks.push(`
          <div class="code-wrapper">
            <div class="code-header">
              <span>${label}</span>
              <button class="copy-code-btn" type="button" onclick="copyCodeBlock(this)">Copy</button>
            </div>
            <pre><code>${code.trim()}</code></pre>
          </div>
        `);
        return `__CODE_BLOCK_${idx}__`;
      });

      safe = safe
        .replace(/^###\s+(.+)$/gm, "<h3>$1</h3>")
        .replace(/^##\s+(.+)$/gm, "<h3>$1</h3>")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[\s(])\*([^*\s][^*\n]*?)\*(?=[\s.,;:!?)]|$)/g, "$1<em>$2</em>")
        .replace(/`([^`\n]+)`/g, "<code>$1</code>")
        .replace(/^\s*[\*\-]\s+(.+)$/gm, "• $1");

      safe = safe
        .replace(/\n/g, "<br>")
        .replace(/<\/h3><br>/g, "</h3>")
        .replace(/<br>(__CODE_BLOCK_\d+__)/g, "$1")
        .replace(/(__CODE_BLOCK_\d+__)<br>/g, "$1");

      codeBlocks.forEach((block, idx) => {
        safe = safe.replace(`__CODE_BLOCK_${idx}__`, block);
      });

      return safe;
    }

    window.copyCodeBlock = function (btn) {
      const codeEl = btn.closest(".code-wrapper").querySelector("code");
      if (!codeEl) return;
      navigator.clipboard.writeText(codeEl.innerText).then(() => {
        btn.textContent = "Copied!";
        setTimeout(() => (btn.textContent = "Copy"), 1600);
      });
    };

    function appendUserMessage(text, attachmentObj) {
      welcomeView.classList.add("hidden");
      const row = document.createElement("div");
      row.className = "msg-row user";

      if (attachmentObj) {
        const tag = document.createElement("div");
        tag.className = "user-attachment-tag";
        if (attachmentObj.previewUrl) {
          const img = document.createElement("img");
          img.src = attachmentObj.previewUrl;
          tag.appendChild(img);
        } else {
          tag.textContent = attachmentObj.badgeText || `Attached: ${attachmentObj.name}`;
        }
        row.appendChild(tag);
      }

      if (text) {
        const bubble = document.createElement("div");
        bubble.className = "user-bubble";
        bubble.textContent = text;
        row.appendChild(bubble);
      }

      chatContainer.appendChild(row);
      scrollToBottom();
    }

    function appendThinkingIndicator() {
      const row = document.createElement("div");
      row.className = "msg-row ai";
      row.innerHTML = `
        <div class="ai-avatar pulse">${SPARK_ICON}</div>
        <div class="thinking-wrap"><span></span><span></span><span></span></div>
      `;
      chatContainer.appendChild(row);
      scrollToBottom();
      return row;
    }

    function appendAIMessage(data) {
      const row = document.createElement("div");
      row.className = "msg-row ai";

      let mediaHtml = "";
      if (data.generatedImage) {
        mediaHtml = `
          <div class="media-card">
            <img src="${data.generatedImage}" alt="Generated illustration" />
            <div class="media-actions">
              <a class="download-media-btn" href="${data.generatedImage}" download="jarvis-illustration.png">Download Image</a>
            </div>
          </div>
        `;
      } else if (data.generatedSvg) {
        const svgBlobUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(data.generatedSvg);
        mediaHtml = `
          <div class="media-card">
            ${data.generatedSvg}
            <div class="media-actions">
              <a class="download-media-btn" href="${svgBlobUrl}" download="jarvis-diagram.svg">Download SVG</a>
            </div>
          </div>
        `;
      }

      row.innerHTML = `
        <div class="ai-avatar">${SPARK_ICON}</div>
        <div class="ai-content">
          ${formatReply(data.reply)}
          ${mediaHtml}
        </div>
      `;
      chatContainer.appendChild(row);
      scrollToBottom();
    }

    async function sendPrompt(text) {
      const cleanText = text.trim();
      if ((!cleanText && !pendingAttachment) || isSending || isProcessingFile || !activePasscode) return;

      isSending = true;
      sendBtn.disabled = true;

      const currentAttachment = pendingAttachment;
      appendUserMessage(cleanText, currentAttachment);
      promptInput.value = "";
      promptInput.style.height = "auto";
      clearAttachment();

      const loader = appendThinkingIndicator();

      const payloadAttachment = currentAttachment
        ? {
            type: currentAttachment.type,
            mimeType: currentAttachment.mimeType,
            data: currentAttachment.data,
            fileUri: currentAttachment.fileUri,
            content: currentAttachment.content,
            name: currentAttachment.name,
            slideCount: currentAttachment.slideCount,
            slidesText: currentAttachment.slidesText,
            slideImages: currentAttachment.slideImages,
          }
        : null;

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: cleanText,
            passcode: activePasscode,
            history,
            attachment: payloadAttachment,
          }),
        });

        if (res.status === 401) {
          loader.remove();
          logoutUser("Session expired. Please log in again.");
          return;
        }

        const data = await res.json();
        loader.remove();
        appendAIMessage(data);

        if (res.ok) {
          const historyNote = currentAttachment
            ? `${cleanText || "Analyze this file"} [${currentAttachment.badgeText || currentAttachment.name}]`
            : cleanText;
          history.push({ role: "user", parts: [{ text: historyNote }] });
          history.push({ role: "model", parts: [{ text: data.reply }] });
        }
      } catch (err) {
        loader.remove();
        appendAIMessage({
          reply: "Could not reach J.A.R.V.I.S. core, sir. Please check your connection and try again.",
        });
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        if (window.innerWidth > 600) promptInput.focus();
      }
    }

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      sendPrompt(promptInput.value);
    });

    promptInput.addEventListener("input", () => {
      promptInput.style.height = "auto";
      promptInput.style.height = Math.min(promptInput.scrollHeight, 140) + "px";
    });

    promptInput.addEventListener("keydown", (e) => {
      const isMobile = window.innerWidth <= 600;
      if (e.key === "Enter" && !e.shiftKey && !isMobile) {
        e.preventDefault();
        sendPrompt(promptInput.value);
      }
    });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        sendPrompt(chip.getAttribute("data-prompt"));
      });
    });
  </script>
